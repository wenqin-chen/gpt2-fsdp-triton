name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync (frozen lock, CPU torch)
        run: uv sync --frozen --extra cpu --extra dev
      - name: Ruff
        run: uv run --no-sync ruff check . && uv run --no-sync ruff format --check .
      - name: mypy
        run: uv run --no-sync mypy
      - name: Tests (CPU; GPU tests run on the cluster with -m gpu)
        run: uv run --no-sync pytest -q
